; ============================================================================
; Supervisor config -- Laravel queue worker (srgroup-marcom-chatbot)
;
; Menjalankan `php artisan queue:work` sebagai proses background permanen,
; supaya job seperti RunScrapeJob (tombol "Jalankan Sekarang" scraping) dan
; RunMetaSyncJob (tombol "Sync Sekarang" Meta) benar-benar diproses tanpa
; perlu ada orang yang buka terminal & jalankan queue:work manual.
;
; INSTALASI (Ubuntu/Debian):
;   1. sudo apt install supervisor   (kalau belum ada)
;   2. Sesuaikan 3 hal di bawah ini dulu sebelum copy:
;        - directory : path absolut ke folder project di server
;        - user      : user yang punya izin ke folder project (mis. www-data,
;                       atau user deploy kamu -- JANGAN root)
;        - command   : path php-nya kalau bukan /usr/bin/php (cek: which php)
;   3. sudo cp deploy/supervisor/srgroup-marcom-queue-worker.conf \
;              /etc/supervisor/conf.d/
;   4. sudo supervisorctl reread
;   5. sudo supervisorctl update
;   6. sudo supervisorctl status   -- pastikan status RUNNING
;
; SETELAH DEPLOY KODE BARU (penting!):
;   Worker yang sudah jalan MEMORY-nya masih pegang kode versi LAMA sampai
;   proses di-restart -- --max-time=3600 di bawah otomatis merestart tiap 1
;   jam (Supervisor langsung nyalain lagi karena autorestart=true), tapi kalau
;   mau perubahan kode langsung kepakai SEKARANG juga, jalankan:
;     php artisan queue:restart
;   (aman dipanggil kapan saja -- worker akan selesaikan job yang sedang
;   jalan dulu baru berhenti, lalu Supervisor otomatis start ulang.)
;
; KENAPA stopwaitsecs=620 (BUKAN default 10 detik Supervisor):
;   App\Jobs\RunScrapeJob sengaja declare $timeout = 600 detik (headless
;   browser buat Instagram/TikTok bisa lama). Kalau stopwaitsecs lebih
;   pendek dari itu, Supervisor bakal SIGKILL paksa proses ini duluan
;   sebelum job-nya selesai wajar -- scraping keputus di tengah jalan tiap
;   kali ada restart/deploy yang pas nabrak jam sibuk scraping. 620 = 600
;   detik budget job + buffer 20 detik.
; ============================================================================

[program:srgroup-marcom-queue-worker]
process_name=%(program_name)s_%(process_num)02d
directory=/var/www/srgroup-marcom-chatbot
command=php artisan queue:work database --sleep=3 --tries=3 --backoff=10 --max-time=3600 --timeout=180
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=620
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/srgroup-marcom-chatbot/storage/logs/queue-worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
