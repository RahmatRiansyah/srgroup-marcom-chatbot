; ============================================================================
; Supervisor config -- Laravel scheduler (srgroup-marcom-chatbot)
;
; `php artisan schedule:run` (yang dipakai routes/console.php untuk jadwal
; scrape:run 06:00 & meta:sync tiap 30 menit) BUKAN proses yang jalan terus --
; dia cuma "cek jadwal sekali, jalankan yang due, lalu keluar". Makanya
; normalnya butuh cron asli (`* * * * * php artisan schedule:run`) yang
; memanggilnya tiap menit.
;
; Supaya tidak perlu pasang crontab manual di server juga, dipakai
; `php artisan schedule:work` sebagai gantinya -- ini perintah bawaan Laravel
; yang jalan TERUS (foreground) dan otomatis memanggil schedule:run tiap
; menit sendiri. Jadi 1 proses ini di bawah Supervisor sudah cukup untuk
; jadwal harian & 30-menitan tetap jalan otomatis.
;
; PENTING: kalau server ini JUGA punya crontab asli yang manggil
; `schedule:run`, HAPUS crontab itu dulu -- schedule:work + cron asli
; berjalan bersamaan berarti scrape:run/meta:sync bisa terpanggil 2x.
;
; INSTALASI: sama seperti srgroup-marcom-queue-worker.conf (lihat komentar
; di file itu) -- sesuaikan directory/user, copy ke /etc/supervisor/conf.d/,
; lalu `supervisorctl reread && supervisorctl update`.
; ============================================================================

[program:srgroup-marcom-scheduler]
process_name=%(program_name)s
directory=/var/www/srgroup-marcom-chatbot
command=php artisan schedule:work
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=1
redirect_stderr=true
stdout_logfile=/var/www/srgroup-marcom-chatbot/storage/logs/scheduler.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
